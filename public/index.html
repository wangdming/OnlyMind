<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="/manifest.json" />
  <title>OnlyMind</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>OnlyMind</h1>
    <button id="settingsBtn" class="icon-btn" title="设置">⚙︎</button>
  </header>

  <!-- Settings / token -->
  <section id="settings" class="card hidden">
    <label>访问令牌 (Token)
      <input id="token" type="password" placeholder="粘贴电脑启动时打印的 token" autocomplete="off" />
    </label>
    <button id="saveToken">保存</button>
    <p id="connStatus" class="muted"></p>

    <div id="keysBox">
      <h3 class="sub">API Key(用于 OpenAI / Anthropic 引擎)</h3>
      <label>OpenAI API Key <span id="st-openai" class="keystat"></span>
        <input id="key-openai" type="password" placeholder="sk-..." autocomplete="off" />
      </label>
      <button class="keysave" data-provider="openai">验证并保存</button>
      <label>Anthropic API Key <span id="st-anthropic" class="keystat"></span>
        <input id="key-anthropic" type="password" placeholder="sk-ant-..." autocomplete="off" />
      </label>
      <button class="keysave" data-provider="anthropic">验证并保存</button>
      <p id="keyMsg" class="muted"></p>
    </div>

    <div id="mcpBox">
      <h3 class="sub">MCP 服务器(供 Claude 引擎调用外部工具)</h3>
      <div id="mcpList" class="muted"></div>
      <div class="actions">
        <button id="mcpFillYmy" type="button">填充优麦云</button>
        <button id="mcpFillMjjl" type="button">填充卖家精灵</button>
      </div>
      <label>名称 <input id="mcp-name" type="text" placeholder="如 sellerspace" /></label>
      <label>MCP URL <input id="mcp-url" type="text" placeholder="https://.../mcp/" /></label>
      <label>鉴权头名 <input id="mcp-hname" type="text" placeholder="x-api-key 或 secret-key" /></label>
      <label>鉴权头值 <input id="mcp-hval" type="password" placeholder="你的 key(演示:demo_aurelia_2026)" autocomplete="off" /></label>
      <button id="mcpAdd">保存 MCP 服务器</button>
      <p id="mcpMsg" class="muted"></p>
      <div class="actions">
        <button id="mcpCodexApply" type="button">写入 Codex 配置</button>
        <button id="mcpCodexClear" type="button" class="cancel">从 Codex 移除</button>
      </div>
      <p id="mcpCodexMsg" class="muted">Claude 引擎开箱即用;Codex 引擎需点「写入 Codex 配置」(写入 ~/.codex/config.toml,需已装并登录 Codex)。</p>
    </div>
  </section>

  <!-- New task -->
  <section class="card">
    <label>任务内容
      <textarea id="prompt" rows="4" placeholder="例如:在 ~/projects/foo 里把 README 翻译成英文"></textarea>
    </label>
    <div class="row">
      <label class="grow">引擎
        <select id="engine"></select>
      </label>
    </div>
    <div id="apiKeyRow" class="card inline hidden">
      <label>该引擎需要 <span id="apiKeyProvider"></span> API Key
        <input id="apiKeyInput" type="password" placeholder="输入 API Key 后验证" autocomplete="off" />
      </label>
      <button id="apiKeySave">验证并保存</button>
      <p id="apiKeyMsg" class="muted"></p>
    </div>
    <label>会话(多轮续接)
      <select id="session"></select>
    </label>
    <div id="sessionBar" class="actions hidden">
      <button id="sessRename">重命名</button>
      <button id="sessCompress">压缩</button>
      <button id="sessDelete" class="cancel">删除</button>
      <span id="sessMsg" class="muted"></span>
    </div>
    <label>工作目录(可选)
      <input id="cwd" type="text" placeholder="默认用服务端 HOME,例如 /Users/you/projects/foo" />
    </label>
    <label class="checkbox">
      <input id="concise" type="checkbox" checked />
      <span>简洁回答(默认开启;只给最终结果,不要长篇解释)</span>
    </label>
    <label class="checkbox">
      <input id="stream" type="checkbox" />
      <span>实时流式输出(默认关闭;开启后可边跑边看)</span>
    </label>
    <label class="checkbox">
      <input id="mcp" type="checkbox" />
      <span>启用 MCP(让 Claude 调用已配置的外部工具,如优麦云/卖家精灵)</span>
    </label>
    <button id="submit" class="primary">发送任务</button>
    <p id="submitMsg" class="muted"></p>
  </section>

  <!-- History -->
  <section>
    <h2>历史任务</h2>
    <div id="list"></div>
    <button id="loadMore" class="hidden">加载更多</button>
    <p id="listMsg" class="muted"></p>
  </section>

  <footer id="footer" class="muted"></footer>

  <script src="/app.js"></script>
</body>
</html>
